[develop]
script_dir=$base/lib/ros2_robot_dashboard
[install]
install_scripts=$base/lib/ros2_robot_dashboard

[flake8]
max-line-length = 100
exclude = .pixi,build,install,log
extend-ignore = E203,W503,W504,E704
# sample "ros2 launch --show-args" output kept verbatim
per-file-ignores = test/core/test_event_bus_presets_args.py:E501

[tool:pytest]
testpaths = test
timeout = 120
markers =
    ros: needs a working rclpy (DDS); skipped when rclpy is unavailable
    qt: needs PySide6
    cell: needs the UR mock-hardware test cell
